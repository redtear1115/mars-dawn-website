name: Site

# Pull requests (forks included) only run the check: no secrets, read-only token.
# Never switch to pull_request_target, and never put PR titles, branch names or
# commit messages straight into `run:`; pass them through `env:` if ever needed.
# release-<version> (e.g. release-1.0.2) collects a version's PRs before one PR takes it to main;
# its PRs and pushes run the check too. Not release/<version>: git can't have both `release` and
# `release/…`. Only a push to `release` itself deploys (see `deploy`).
on:
  pull_request:
    branches: [main, release, "release-*"]
  push:
    branches: [main, release, "release-*"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerated pages match the commit
        run: |
          python3 scripts/build_pages.py >/dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Run python3 scripts/build_pages.py and commit the result."
            exit 1
          fi
      - name: Every page's hreflang set is complete and reciprocal
        run: python3 scripts/check_hreflang.py
      - name: Every same-site link points at a file that exists
        run: python3 scripts/check_links.py
      # public/_redirects: fixed destinations, no tracking parameters, and the phase's rule for
      # /go/app-store. --self-test plants a break of each kind first and fails if one is missed.
      - name: Every redirect goes where the phase allows, and nowhere else
        run: python3 scripts/check_redirects.py --self-test
      - name: Every schema.org Offer states its availability
        run: python3 scripts/check_offers.py
      - name: The site's launch-phase invariants hold
        run: python3 scripts/check_invariants.py
      # The homepage window's themes, labels and sample must be the kit's and the app's.
      # --kit reads the kit's public source at the pinned tag; --self-test plants drift of
      # each kind and fails if any goes unnoticed. The app side is checked on a Mac:
      # python3 scripts/sync_hero_sources.py --kit ... --app ... --check
      - name: The homepage window matches the kit and the app
        run: python3 scripts/check_hero.py --kit --self-test
      - name: The agent skill is the one the documented marsdawn release prints
        run: python3 scripts/check_skill.py
      # Reads the kit's CLIFailure.Code at the same tag; --self-test plants drift of each kind first.
      - name: The error schema and exit codes match the documented marsdawn release
        run: python3 scripts/check_error_kinds.py --self-test
      # The legal pages (privacy and support) are rendered from content/legal/*.md through the kit's own
      # MarkdownRenderer, which needs macOS (scripts/render_legal.py); this only checks that
      # what's committed still matches its source and the pinned kit tag, from recorded
      # hashes — see content/legal/manifest.json and the script's own docstring.
      - name: Legal pages match their Markdown source and the pinned kit tag
        run: python3 scripts/check_legal_render.py --self-test && python3 scripts/check_legal_render.py
      # The theme gallery isn't served yet and nothing reads /themes/v1/ (see README). Once it ships,
      # make this check mandatory: from then on /themes/v1/index.json must never disappear.
      - name: Theme index is valid JSON
        run: |
          if [ -f public/themes/v1/index.json ]; then
            python3 -m json.tool public/themes/v1/index.json >/dev/null
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the IndexNow step below diffs against the commit
          # this push replaced, which a shallow clone might not have.
          fetch-depth: 0
      - name: Require the account ID
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_ACCOUNT_ID variable on the production environment."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.133.0"
          command: deploy
      # Pings IndexNow (Bing, Yandex, Seznam) with the URLs this deploy
      # changed, so they're crawled in hours instead of weeks. No secret or
      # token: the key is a public file already committed to public/. The
      # event's `before` SHA is event data, so it's passed through `env:`
      # rather than interpolated into the script line below, per this
      # workflow's own rule against splicing event text into `run:`. A
      # failed or skipped ping must never fail the deploy, so this step
      # can't fail: scripts/indexnow_notify.py catches its own errors and
      # prints a `::warning::` instead.
      - name: Notify IndexNow of changed URLs
        env:
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/indexnow_notify.py
