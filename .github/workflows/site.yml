name: Site

# Pull requests (forks included) only run the check: no secrets, read-only token.
# Never switch to pull_request_target, and never put PR titles, branch names or
# commit messages straight into `run:`; pass them through `env:` if ever needed.
# release-<version> (e.g. release-1.0.2) collects a version's PRs before one PR takes it to main;
# its PRs and pushes run the check too. Not release/<version>: git can't have both `release` and
# `release/…`. Only a push to `release` itself deploys (see `deploy`).
on:
  pull_request:
    branches: [main, release, "release-*"]
    # labeled/unlabeled: the theme check reads the theme-author-change label (#144), and a re-run
    # reuses the original event's labels, so a label change needs an event of its own.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, release, "release-*"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # One run per PR: a newer push or label change cancels the older run (#144 review L7). Pushes
    # get a group of their own (run_id), so a push's run is never cancelled.
    concurrency:
      group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerated pages match the commit
        run: |
          python3 scripts/build_pages.py >/dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Run python3 scripts/build_pages.py and commit the result."
            exit 1
          fi
      # Every generated page's only inline <script> is the CSP's own hashed pair (Consent Mode
      # default, GTM loader); anything else is silently blocked by script-src in a real browser
      # (mars-dawn-website#147's verifier-caught bug: an inline theme-sim bootstrap). --self-test
      # plants an inline <script> first and fails unless it's caught.
      - name: No inline <script> outside the CSP's hashed pair
        run: python3 scripts/check_no_inline_scripts.py --self-test && python3 scripts/check_no_inline_scripts.py
      - name: Every page's hreflang set is complete and reciprocal
        run: python3 scripts/check_hreflang.py
      # de, fr, es and ko are served only when their copy_<l>.py says COMPLETE = True (scripts/locales.py).
      # check_locales.py fails a locale that is half served (missing pages, legal, images, sitemap entries,
      # English copy) and any trace of one that isn't complete; --self-test builds a throwaway locale in a
      # scratch copy and plants a break of each rule. new_locale.py --check fails a skeleton whose structure
      # no longer matches en's (e.g. after the theme gallery pages arrive).
      - name: A planned locale is served completely or not at all
        run: |
          python3 scripts/check_locales.py
          python3 scripts/new_locale.py --check
          python3 scripts/check_locales.py --self-test
      - name: Every same-site link points at a file that exists
        run: python3 scripts/check_links.py
      # public/_redirects: fixed destinations, no tracking parameters, and the phase's rule for
      # /go/app-store. --self-test plants a break of each kind first and fails if one is missed.
      - name: Every redirect goes where the phase allows, and nowhere else
        run: python3 scripts/check_redirects.py --self-test
      - name: Every schema.org Offer states its availability
        run: python3 scripts/check_offers.py
      - name: The site's launch-phase invariants hold
        run: python3 scripts/check_invariants.py
      # The homepage window's themes, labels and sample must be the kit's and the app's.
      # --kit reads the kit's public source at the pinned tag; --self-test plants drift of
      # each kind and fails if any goes unnoticed. The app side is checked on a Mac:
      # python3 scripts/sync_hero_sources.py --kit ... --app ... --check
      - name: The homepage window matches the kit and the app
        run: python3 scripts/check_hero.py --kit --self-test
      - name: The agent skill is the one the documented marsdawn release prints
        run: python3 scripts/check_skill.py
      # Reads the kit's CLIFailure.Code at the same tag; --self-test plants drift of each kind first.
      - name: The error schema and exit codes match the documented marsdawn release
        run: python3 scripts/check_error_kinds.py --self-test
      # The legal pages (privacy and support) are rendered from content/legal/*.md through the kit's own
      # MarkdownRenderer, which needs macOS (scripts/render_legal.py); this only checks that
      # what's committed still matches its source and the pinned kit tag, from recorded
      # hashes — see content/legal/manifest.json and the script's own docstring.
      - name: Legal pages match their Markdown source and the pinned kit tag
        run: python3 scripts/check_legal_render.py --self-test && python3 scripts/check_legal_render.py
      # public/themes/v1/ (index.json, versioned files, published.json) against themes/ (#77,
      # #144): the index's shape (design §5.1), index <-> themes/ bijection, sha256s, previews,
      # revocations; then, against the base -- the merge commit's first parent, fetched by SHA
      # (fails closed if it can't be read) -- published.json only grows, ids aren't reused, and
      # on PRs author.github, version order and revocations hold; and the PR author's class (bot /
      # maintainer / anyone else), read by id from the event payload file, never from event text
      # in `run:`. THEME_MAINTAINER_IDS is a repo variable (numeric GitHub ids); unset means the
      # script's default. ADVISORY for a PR that touches scripts/** or .github/**: it runs the PR's
      # own copy of this script and workflow, so for those PRs the diff review is the gate. Labels
      # (theme-author-change, theme-version-rollback) can be applied by anyone with triage access.
      # --self-test plants a break of each rule first and requires the check's own message for it.
      - name: Theme index is present and valid
        env:
          THEME_MAINTAINER_IDS: ${{ vars.THEME_MAINTAINER_IDS }}
        run: python3 scripts/check_theme_index.py --self-test && python3 scripts/check_theme_index.py --ci
      # vendor/kit-themes/<sha>/ (scripts/sync_theme_kit.py, run locally on macOS) is the kit's
      # theme contract the simulator's JS ports are checked against; this holds it to the kit's
      # pinned commit on GitHub, to its own manifest, and to full sweep coverage, without
      # building the kit itself.
      - name: The vendored kit theme contract matches the pinned commit
        run: python3 scripts/check_theme_kit.py --self-test && python3 scripts/check_theme_kit.py
      # The theme simulator's JavaScript ports (public/assets/theme-sim/) against the vendored kit
      # tree above: every fixture, every built-in and the whole option sweep, rule ids and CSS
      # both, plus the .sim-preview rescoping transform's own fixture. Plain `node`, no npm.
      - name: The theme simulator's JS ports match the kit
        run: node scripts/check_theme_sim.mjs
      # Every workflow (#143, plan F15): no ${{ github.event.* }} inside `run:`, no
      # pull_request_target, every `uses:` pinned to a full commit SHA, and no write permission in a
      # job that runs brew/swift/the kit. --self-test plants a break of each rule first (in a
      # synthetic workflow and in the real ones) and fails unless each is caught by its own rule.
      - name: Workflows keep event text out of shells and write scopes away from the kit
        run: python3 scripts/check_workflows.py --self-test && python3 scripts/check_workflows.py
      # The theme submission workflows (theme-submission / theme-approve / theme-from-pr) only run
      # from the default branch, so their logic lives in scripts/submission/ and is tested here on
      # synthetic event payloads and API responses, positive and negative. The runner fails on too
      # few tests, not only on a failing one.
      - name: Theme submission scripts pass their unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/submission/run_tests.py
      # The community gallery (#145, W4): a hostile fixture (name/summary containing `"<>&'`,
      # `</script>`, `javascript:`) proves every index-derived string is escaped and that only a
      # theme's own id/version -- never its name or summary -- ever reaches an href; the report
      # link and its mailto both round-trip to exactly id + version through urllib.parse.
      - name: The community theme gallery escapes and links correctly
        run: python3 scripts/check_theme_gallery.py --self-test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the IndexNow step below diffs against the commit
          # this push replaced, which a shallow clone might not have.
          fetch-depth: 0
      - name: Require the account ID
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_ACCOUNT_ID variable on the production environment."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.133.0"
          command: deploy
      # Pings IndexNow (Bing, Yandex, Seznam) with the URLs this deploy
      # changed, so they're crawled in hours instead of weeks. No secret or
      # token: the key is a public file already committed to public/. The
      # event's `before` SHA is event data, so it's passed through `env:`
      # rather than interpolated into the script line below, per this
      # workflow's own rule against splicing event text into `run:`. A
      # failed or skipped ping must never fail the deploy, so this step
      # can't fail: scripts/indexnow_notify.py catches its own errors and
      # prints a `::warning::` instead.
      - name: Notify IndexNow of changed URLs
        env:
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/indexnow_notify.py
