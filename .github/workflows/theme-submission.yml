name: Theme submission

# A theme submitted from the simulator (/themes/new/) arrives as an issue from the theme-submission
# form. This validates it with the kit and writes one comment with the result (#143; plan-website-104
# W2). The issue body is a stranger's text: it is read by scripts/submission/gate.py from the API,
# never through ${{ github.event.* }} in a shell line (scripts/check_workflows.py enforces that).
#
# Three jobs, so no job that touches the submission with third-party code holds a write scope:
#   gate     ubuntu, no permissions: reads the issue, decides skip / reject / validate, hands the
#            theme's exact bytes on as an artifact and their sha256 as an output.
#   validate macOS, no permissions: the kit CLI at the pinned commit (built by sync_theme_kit.py's own
#            build on a cache miss; tree hash, --version and a smoke test checked every time), then
#            `marsdawn theme validate --require-complete --json` on those bytes.
#   comment  ubuntu, issues: write only, no third-party code: writes or updates the one comment by
#            github-actions[bot] that carries the marker and the validated sha256.
# No secrets are used. Issue-triggered workflows only run from the default branch.

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: theme-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: ${{ contains(github.event.issue.labels.*.name, 'theme-submission') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      action: ${{ steps.gate.outputs.action }}
      reason: ${{ steps.gate.outputs.reason }}
      sha256: ${{ steps.gate.outputs.sha256 }}
      number: ${{ steps.gate.outputs.number }}
      opener: ${{ steps.gate.outputs.opener }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the submission
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/submission/gate.py submission --out "$RUNNER_TEMP/theme"
      - if: ${{ steps.gate.outputs.action == 'validate' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-source
          path: ${{ runner.temp }}/theme/theme.json
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: gate
    if: ${{ needs.gate.outputs.action == 'validate' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kit CLI cache key (the pinned kit commit)
        id: key
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/submission/kit_cli.py key
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kit-cli
          key: ${{ steps.key.outputs.key }}-${{ runner.os }}-${{ runner.arch }}
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image (as the kit's CI).
      - name: Use Xcode 26
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - name: Build the kit CLI at the pinned commit
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/submission/kit_cli.py build --dir "$RUNNER_TEMP/kit-cli"
      # Saved before any submitted byte is on this runner.
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kit-cli
          key: ${{ steps.key.outputs.key }}-${{ runner.os }}-${{ runner.arch }}
      - name: Check the kit CLI (tree hash, version, smoke test)
        id: kit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/submission/kit_cli.py verify --dir "$RUNNER_TEMP/kit-cli"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-source
          path: ${{ runner.temp }}/theme
      - name: Validate with the kit
        env:
          GATE_SHA256: ${{ needs.gate.outputs.sha256 }}
          OPENER: ${{ needs.gate.outputs.opener }}
          KIT_BIN: ${{ steps.kit.outputs.bin }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 scripts/submission/validate.py --bin "$KIT_BIN" --theme "$RUNNER_TEMP/theme/theme.json"
          --out "$RUNNER_TEMP/result/result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-result
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 7

  comment:
    needs: [gate, validate]
    if: ${{ !cancelled() && (needs.gate.outputs.action == 'reject' || needs.gate.outputs.action == 'validate') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ needs.validate.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-result
          path: ${{ runner.temp }}/result
      - name: Write the validation comment
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.gate.outputs.number }}
          GATE_ACTION: ${{ needs.gate.outputs.action }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          GATE_SHA256: ${{ needs.gate.outputs.sha256 }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/submission/comment.py --result "$RUNNER_TEMP/result/result.json"
