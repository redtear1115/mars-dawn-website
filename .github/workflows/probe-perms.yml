name: Probe (temporary, removed before review)

on:
  push:
    branches: [theme-submit-143]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: API reads with a no-permission token
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts/submission")
          import common
          api = common.GitHub.from_env()
          for path in ("/repos/{repo}/issues/143", "/repos/{repo}/issues/143/comments",
                       "/repos/{repo}/pulls/149", "/repos/{repo}/pulls/149/files",
                       "/repos/{repo}/pulls/149/commits"):
              try:
                  value = api.get(path)
                  print("OK ", path, type(value).__name__)
              except common.ApiError as err:
                  print("ERR", path, err.status)
          PY
